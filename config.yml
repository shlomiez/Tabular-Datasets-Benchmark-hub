# Experiment Configuration

# Peeling Configuration
use_peeling: false
peeling_tau: 50
peeling_low_auc_threshold: 0.70
resume_output_dir: "/home/fast/ezrashl1/Tabular-Datasets-Benchmark-hub/output/2026-06-25_00-36-53"
seed: 42
n_splits: 5

# Options: "features_ratio", "lamda_tuning"
feature_selection_method: features_ratio

# Feature selectors to evaluate; can include multiple entries like dataset_names.
# Options include: "stg", "lspin", "concrete_autoencoder"
feature_selectors:
  # - stg
  # - lspin
  - concrete_autoencoder

# Options: "etree", "tabiclv2"
prediction_model_type: tabiclv2

# Options: "full", "selector_only"
evaluation_mode: full

# Datasets to run, e.g. ["RELATHE", "madelon"]
dataset_names:
  - Breast
  - madelon
  - colon
  - SMK-CAN-187
  - RELATHE
  - leukemia

# Feature ratios to evaluate
feature_ratios: [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0.05]

# Default lambda values (if lamda_tuning is used and not overridden by dataset-specific config)
lambda_values: [0.1, 0.5, 1.0, 5.0, 10.0, 50.0, 100.0]

# Lambda ranges configured per dataset
lambda_ranges_by_dataset:
  madelon:
    stg: [0.9, 1.0963, 1.3354, 1.6267, 1.9814, 2.4136, 3.0]
    lspin: [0.01, 0.0316, 0.1, 0.3162, 1.0, 3.1623, 10.0]
  RELATHE:
    stg: [10.0, 10.916, 11.916, 13.007, 14.198, 15.498, 17.0]
    lspin: [0.03, 0.129, 0.554, 2.381, 10.233, 43.989, 200.0]

# --- Concrete Autoencoder & TabICL Pipeline Settings ---
# Use dataset_names for .mat datasets in data/; dataset_path is optional for a single CSV/.mat file.
# dataset_path: 
#   # - "data/Challenging Data Collections/Unaltered Data Sources/Breast.mat"
#   - "data/Challenging Data Collections/Unaltered Data Sources/madelon.mat"
#   # - "data/Standard Difficulty Data Collections/scikit-feature/colon.mat"
#   # - "data/Standard Difficulty Data Collections/scikit-feature/SMK-CAN-187.mat"
#   - "data/Standard Difficulty Data Collections/scikit-feature/RELATHE.mat"
#   # - "data/Standard Difficulty Data Collections/scikit-feature/leukemia.mat"
# target_column_name: "target" # Update with your actual target column name for CSV datasets
# task_type: "classification"
concrete_k_values: [60, 30, 10, 5, 1]
